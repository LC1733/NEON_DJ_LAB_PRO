<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<title>DJ CONSOLE PRO</title>
<style>
html,body{margin:0;min-height:100%;background:#06080b;color:#dfe5ec;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}
.wrap{max-width:520px}.mark{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid #2a323e;border-radius:6px;background:#0e1219;font-weight:800;letter-spacing:.08em}h1{font-size:18px;letter-spacing:.18em;margin:0 0 10px}p{color:#7d8794;line-height:1.6}.error{color:#ff5b5b}
</style>
</head>
<body>
<main id="loader"><div class="wrap"><div class="mark">DJ</div><h1>DJ CONSOLE PRO</h1><p id="status">Cargando consola…</p></div></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const parts=['00','01','02','03','04'];
    const texts=[];
    for(let i=0;i<parts.length;i++){
      const n=parts[i];
      status.textContent=`Cargando módulo ${i+1} de ${parts.length}…`;
      const r=await fetch(`payload/dj-html-${n}.txt`,{cache:'no-store'});
      if(!r.ok) throw new Error(`No se pudo cargar dj-html-${n} (${r.status})`);
      texts.push(await r.text());
    }
    let html=texts.join('');
    if(!html.includes('<title>DJ CONSOLE PRO</title>')) throw new Error('El paquete de la aplicación no superó la verificación de contenido.');

    html=html.replace(
      '<meta name="viewport" content="width=device-width,initial-scale=1">',
      '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
    );

    const mobileCss=`<style id="mobile-responsive">
@media (max-width:900px){
  html,body{height:auto!important;min-height:100%!important;overflow:auto!important;overscroll-behavior-y:contain}
  body{font-size:12px!important;padding-bottom:env(safe-area-inset-bottom)}
  .shell{display:flex!important;flex-direction:column!important;height:auto!important;min-height:100vh!important}
  .browser{width:100%!important;max-height:32vh!important;min-height:180px!important;border-right:0!important;border-bottom:1px solid var(--line)!important}
  .bh{grid-template-columns:1fr auto!important;align-items:center!important;padding:8px!important}
  .bh h2{grid-column:1/-1}
  .srch{min-width:0!important}
  .imp{white-space:nowrap!important;padding:7px 9px!important}
  .tlist{max-height:22vh!important}
  .main{width:100%!important;min-height:0!important;overflow:visible!important}
  .top{height:auto!important;min-height:44px!important;flex-wrap:wrap!important;gap:6px!important;padding:6px 8px!important;padding-top:max(6px,env(safe-area-inset-top))!important;position:sticky!important;top:0!important;z-index:30!important}
  .top h1{font-size:.68rem!important}
  .chip{max-width:130px!important}
  .spacer{display:none!important}
  .stack{padding:6px!important}
  canvas.zoom{height:78px!important}
  canvas.ov{height:24px!important}
  .console{display:flex!important;flex-direction:column!important;gap:8px!important;padding:8px!important;padding-bottom:calc(8px + env(safe-area-inset-bottom))!important;overflow:visible!important}
  .deck,.mixer{width:100%!important;min-width:0!important}
  #deckA{order:1!important}
  .mixer{order:2!important}
  #deckB{order:3!important}
  .jogzone{grid-template-columns:minmax(112px,35vw) 1fr!important;gap:8px!important}
  canvas.jog{width:min(135px,35vw)!important;height:min(135px,35vw)!important}
  .transport,.pads{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .loops{grid-template-columns:repeat(5,minmax(0,1fr))!important}
  .fxgrid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .knobs,.knobs.two{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .dtitle,.chip{overflow:hidden!important;text-overflow:ellipsis!important}
}
@media (max-width:520px){
  .browser{max-height:28vh!important;min-height:150px!important}
  .bh{grid-template-columns:1fr!important;gap:6px!important}
  .bh h2{display:none!important}
  .imp{width:100%!important}
  .tlist{max-height:18vh!important}
  .top h1{width:100%!important;text-align:center!important;font-size:.66rem!important}
  .top .chip{max-width:calc(50% - 6px)!important;flex:1 1 42%!important}
  .tb{flex:1 1 30%!important;padding:7px 6px!important}
  .stack{padding:5px 6px!important}
  .wmeta{max-width:78%!important;overflow:hidden!important;white-space:nowrap!important}
  canvas.zoom{height:68px!important}
  canvas.ov{height:20px!important}
  .console{padding:6px!important;gap:6px!important}
  .deck,.mixer{padding:8px!important;gap:7px!important}
  .jogzone{grid-template-columns:105px minmax(0,1fr)!important}
  canvas.jog{width:105px!important;height:105px!important}
  .bigbpm{font-size:1.15rem!important}
  .k{padding:6px!important}
  .transport,.pads,.loops,.fxgrid,.fxrow{gap:4px!important}
  .tbtn{padding:10px 2px!important;font-size:.58rem!important;letter-spacing:.03em!important}
  .pad{padding:10px 1px!important}
  .fx{padding:8px 1px!important;font-size:.52rem!important;letter-spacing:.02em!important}
  .knobs,.knobs.two{gap:5px!important}
  .mixer .hint{font-size:.52rem!important}
}
@media (max-width:380px){
  .top h1{font-size:.60rem!important}
  .chip{font-size:.54rem!important}
  .jogzone{grid-template-columns:92px minmax(0,1fr)!important}
  canvas.jog{width:92px!important;height:92px!important}
  .fxgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .knobs,.knobs.two{grid-template-columns:1fr!important}
}
</style>`;

    html=html.replace('</head>',mobileCss+'</head>');
    status.textContent='Iniciando consola…';
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    status.className='error';
    status.textContent='Error al iniciar DJ CONSOLE PRO: '+err.message;
  }
})();
</script>
</body>
</html>
